# Production stack: PostgreSQL, a one-shot migration run, the API, and Caddy
# serving the SPA and terminating TLS. Copy .env.example to .env first.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: invoice_expense
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d invoice_expense']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runner
    command: ['node', 'dist-be/backend/server/webserver/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  caddy:
    build:
      context: .
      target: web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

networks:
  internal:

volumes:
  pgdata:
  caddy-data:
  caddy-config:
